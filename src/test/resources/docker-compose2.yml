services:
  # Application service - Dockerfile is in the same folder as this docker-compose.yml
  app:
    build: .

    depends_on:
      - db
  # MySQL database service
  db:
    build: World_test-db/.
    image: mysql:latest
    #command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: BuzzLightYear  # Set root password here
      MYSQL_DATABASE: World_test
    ports:
      - "3306:3306"
    volumes:
      - ./World_test-db/World_test.sql:/docker-entrypoint-initdb.d/World_test.sql
